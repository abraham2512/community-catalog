---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: update-jira-issues
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Pipeline that updates JIRA issues from "Modified" to "On QA" status and adds build information as comments
    after a successful build. This pipeline is designed to run after builds complete
    to automatically update the status of related JIRA issues.
  params:
    - name: dataPath
      description: Path to the JSON string of the merged data to use in the data workspace
      type: string
      default: "snapshot.json"
    - name: buildInfo
      description: Information about the build that was generated (e.g., image digest, build ID, etc.)
      type: string
      default: "Build completed successfully"
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      description: Location of trusted artifacts to be used to populate data directory
      type: string
      default: ""
    - name: taskGitUrl
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
      type: string
      default: https://github.com/konflux-ci/community-catalog.git
    - name: taskGitRevision
      description: The revision in the taskGitUrl repo to be used
      type: string
      default: "main"
  workspaces:
    - name: data
      description: The workspace where the snapshot spec json file resides
  tasks:
    - name: update-jira-issues
      taskSpec:
        params:
          - name: dataPath
            description: Path to the JSON string of the merged data to use in the data workspace
            type: string
          - name: buildInfo
            description: Information about the build that was generated (e.g., image digest, build ID, etc.)
            type: string
          - name: ociStorage
            description: The OCI repository where the Trusted Artifacts are stored
            type: string
          - name: ociArtifactExpiresAfter
            description: Expiration date for the trusted artifacts created in the OCI repository. An empty string means the artifacts do not expire
            type: string
          - name: trustedArtifactsDebug
            description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
            type: string
          - name: orasOptions
            description: oras options to pass to Trusted Artifacts calls
            type: string
          - name: sourceDataArtifact
            description: Location of trusted artifacts to be used to populate data directory
            type: string
          - name: taskGitUrl
            description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
            type: string
          - name: taskGitRevision
            description: The revision in the taskGitUrl repo to be used
            type: string
          - name: dataDir
            description: The directory where the data workspace is mounted
            type: string
        workspaces:
          - name: data
            description: The workspace where the snapshot spec json file resides
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: skip-trusted-artifact-operations
            computeResources:
              limits:
                memory: 32Mi
              requests:
                memory: 32Mi
                cpu: 20m
            ref:
              resolver: "git"
              params:
                - name: url
                  value: $(params.taskGitUrl)
                - name: revision
                  value: $(params.taskGitRevision)
                - name: pathInRepo
                  value: stepactions/skip-trusted-artifact-operations/skip-trusted-artifact-operations.yaml
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(workspaces.data.path)
          - name: use-trusted-artifact
            computeResources:
              limits:
                memory: 64Mi
              requests:
                memory: 64Mi
                cpu: 30m
            ref:
              resolver: "git"
              params:
                - name: url
                  value: $(params.taskGitUrl)
                - name: revision
                  value: $(params.taskGitRevision)
                - name: pathInRepo
                  value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
            params:
              - name: workDir
                value: $(workspaces.data.path)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: update-jira-status
            image: quay.io/konflux-ci/release-service-utils:b7f90a1dde20efe9a4063c1082c4f0ce31113bb1
            computeResources:
              limits:
                memory: 32Mi
              requests:
                memory: 32Mi
                cpu: 50m
            env:
              - name: ACCESS_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: konflux-advisory-jira-secret
                    key: token
            script: |
              #!/usr/bin/env bash
              # We do not set -x here because it would leak the ACCESS_TOKEN
              set -eu

              ISSUE_TRACKERS='{
                  "Jira": {
                      "api": "rest/api/2/issue",
                      "servers": [
                          "issues.redhat.com"
                      ]
                  }
              }'

              DATA_FILE="$(workspaces.data.path)/$(params.dataPath)"
              if [ ! -f "${DATA_FILE}" ] ; then
                  echo "No data JSON was provided."
                  exit 1
              fi

              NUM_ISSUES=$(jq -cr '.releaseNotes.issues.fixed | length' "${DATA_FILE}")
              for ((i = 0; i < NUM_ISSUES; i++)); do
                  issue=$(jq -c --argjson i "$i" '.releaseNotes.issues.fixed[$i]' "${DATA_FILE}")
                  server=$(jq -r '.source' <<< "$issue")
                  if [ "$server" != "issues.redhat.com" ] ; then
                      echo "This task currently only supports updating issues on issues.redhat.com"
                      echo "Skipping issue $issue as it is on $server"
                      continue
                  fi

                  CURL_ARGS=(
                    -H "Authorization: Bearer $ACCESS_TOKEN"
                    --retry 3
                  )

                  API=$(jq -r '.[] | select(.servers[] | contains("'"$server"'")) | .api' <<< "$ISSUE_TRACKERS")
                  API_URL="https://$(jq -r '.source' <<< "$issue")/${API}/$(jq -r '.id' <<< "$issue")"

                  # Get current status
                  CURRENT_STATUS=$(curl-with-retry "${CURL_ARGS[@]}" "${API_URL}" | jq -r '.fields.status.name')
                  echo "Current status of issue $issue: $CURRENT_STATUS"

                  # Check if issue is in "Modified" status
                  if [ "$CURRENT_STATUS" != "Modified" ] ; then
                      echo "Issue $issue is not in Modified state (current: $CURRENT_STATUS). Skipping it."
                      continue
                  fi

                  echo "Moving issue $issue from Modified to On QA"
                  
                  # Get the "On QA" transition id
                  if ! ON_QA_ID="$(curl-with-retry "${CURL_ARGS[@]}" "${API_URL}/transitions" \
                    | jq -er '.transitions[] | select(.name=="On QA") | .id')"; then
                      echo "Warning: failed to fetch the On QA state id for issue $issue. We most likely do not have" \
                        "permission to transition it. Will try to add a comment instead."
                      TRANSITION_RC=1
                  else
                      # Move the issue to "On QA" status
                      if ! curl-with-retry "${CURL_ARGS[@]}" -XPOST --data \
                        '{"transition":{"id":"'"$ON_QA_ID"'"}}' \
                        -H "Content-Type: application/json" "${API_URL}/transitions"; then
                          echo "Warning: failed to transition issue $issue to On QA. Will try to add a comment instead."
                          TRANSITION_RC=1
                      else
                          echo "Successfully moved issue $issue to On QA status"
                          TRANSITION_RC=0
                      fi
                  fi

                  # Add comment with build information
                  BUILD_COMMENT="Build completed and moved to QA status.\n\nBuild Information: $(params.buildInfo)\n\nThis issue has been moved from Modified to On QA status as part of the release process."

                  if ! curl-with-retry "${CURL_ARGS[@]}" -XPOST --data \
                    '{"body":"'"$BUILD_COMMENT"'"}' \
                    -H "Content-Type: application/json" "${API_URL}/comment"; then
                      echo "Warning: failed to add comment to issue $issue."
                  else
                      echo "Successfully added build comment to issue $issue"
                  fi
              done
          - name: create-trusted-artifact
            computeResources:
              limits:
                memory: 128Mi
              requests:
                memory: 128Mi
                cpu: 250m
            ref:
              resolver: "git"
              params:
                - name: url
                  value: $(params.taskGitUrl)
                - name: revision
                  value: $(params.taskGitRevision)
                - name: pathInRepo
                  value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(workspaces.data.path)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
          - name: patch-source-data-artifact-result
            computeResources:
              limits:
                memory: 32Mi
              requests:
                memory: 32Mi
                cpu: 20m
            ref:
              resolver: "git"
              params:
                - name: url
                  value: $(params.taskGitUrl)
                - name: revision
                  value: $(params.taskGitRevision)
                - name: pathInRepo
                  value: stepactions/patch-source-data-artifact-result/patch-source-data-artifact-result.yaml
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)